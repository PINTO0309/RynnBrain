[project]
name = "rynnbrain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.12"
dependencies = [
    "accelerate==1.13.0",
    "iprogress==0.4",
    "ipykernel==7.2.0",
    "ipython==9.13.0",
    "ipywidgets==8.1.8",
    "matplotlib==3.10.9",
    "opencv-python==4.11.0.86",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "transformers==4.57.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
